# Compila la app de Android (APK) en GitHub.
# • Manualmente: pestaña "Actions" → "App Android" → "Run workflow" (el APK queda en "Artifacts").
# • Al publicar una versión: crear la etiqueta android-vX.Y.Z (la de package.json → androidVersion);
#   el APK se publica en "Releases" como ChamuFlac.apk.
#
# Secretos del repositorio (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD → clave de firma (la misma SIEMPRE:
#     si cambia, los teléfonos no podrán actualizar la app).
#   GOOGLE_SERVICES_JSON → contenido de google-services.json de Firebase (activa los avisos push).
# Sin clave de firma se compila igualmente, firmado "de depuración" (solo para pruebas).
name: App Android

on:
  workflow_dispatch:
  push:
    tags: ['android-v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Dependencias
        run: npm ci

      - name: Configuración de Firebase (avisos push)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "PUSH_ENABLED=1" >> "$GITHUB_ENV"
            echo "Avisos push: activados"
          else
            echo "::warning::Sin GOOGLE_SERVICES_JSON: la app se compila sin avisos push."
          fi

      - name: Versión
        run: |
          V=$(node -p "require('./package.json').androidVersion")
          IFS=. read -r A B C <<< "$V"
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((A * 10000 + B * 100 + C))" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/android-v* && "${GITHUB_REF#refs/tags/android-v}" != "$V" ]]; then
            echo "::error::La etiqueta ${GITHUB_REF#refs/tags/} no coincide con androidVersion ($V) de package.json"; exit 1
          fi

      - name: Web de la app y sincronización con Android
        run: npm run build:app && npx cap sync android

      - name: Clave de firma
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            printf '%s' "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::Sin clave de firma: APK de prueba firmado en modo depuración (no sirve para actualizar)."
          fi

      - name: Compilar APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "$SIGNED" = "1" ]; then TASK=assembleRelease; OUT=app/build/outputs/apk/release/app-release.apk
          else TASK=assembleDebug; OUT=app/build/outputs/apk/debug/app-debug.apk; fi
          ./gradlew $TASK -PversionCode=$VERSION_CODE -PversionName=$VERSION --no-daemon --stacktrace
          cp "$OUT" ../ChamuFlac.apk
          ls -la ../ChamuFlac.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ChamuFlac-${{ env.VERSION }}
          path: ChamuFlac.apk

      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          files: ChamuFlac.apk
          name: ChamuFlac Android ${{ env.VERSION }}
          prerelease: ${{ env.SIGNED != '1' }}
          body: |
            App de Android de ChamuFlac, versión ${{ env.VERSION }}.
            Descarga **ChamuFlac.apk** en el teléfono, ábrelo e instálalo.
